[project]
name = "markdown-okf-schema-studio"
version = "0.1.0"
description = "Schema-aware Markdown editor and live preview for OKF bundles."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
release = ["commitizen>=4.9.1"]
requirements = ["okf-schema>=0.13.0"]
docs = [
  "myst-parser>=4.0.1",
  "pillow>=13.0.0",
  "playwright>=1.64.0",
  "pytest>=9.1.1",
  "sphinx>=8.1.3",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "npm"
tag_format = "v$version"
version_scheme = "semver"
major_version_zero = false
bump_pattern = '^(BREAKING[\- ]CHANGE|\w+!|feat|fix|refactor|perf|chore|docs|style|test|build|ci|revert)(\(.+\))?(!)?(:|\s)'
bump_map = { "^.+!" = "MAJOR", "^BREAKING[\\- ]CHANGE" = "MAJOR", "^feat" = "MINOR", "^.*" = "PATCH" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
