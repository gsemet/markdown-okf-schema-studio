[project]
name = "markdown-okf-schema-studio"
version = "0.1.0"
description = "Schema-aware Markdown editor and live preview for OKF bundles."
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
docs = [
  "myst-parser>=4.0.1",
  "pillow>=12.0.0",
  "playwright>=1.64.0",
  "pytest>=9.1.1",
  "sphinx>=8.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
