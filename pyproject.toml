[project]
name = "markdown-okf-schema-studio"
version = "0.1.0"
description = "Schema-aware Markdown editor and live preview for OKF bundles."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
release = ["commitizen>=4.19.3"]
requirements = ["okf-schema>=0.16.0"]
docs = [
  "myst-parser>=4.0.1",
  "pillow>=13.0.0",
  "playwright>=1.64.1",
  "pytest>=9.2.0",
  "sphinx>=8.1.3",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "npm"
tag_format = "v$version"
version_scheme = "semver"
major_version_zero = false
bump_pattern = '^(BREAKING[\- ]CHANGE|\w+!|feat|fix|refactor|perf|chore|docs|style|test|build|ci|revert)(\(.+\))?(!)?(:|\s)'
bump_map = { "^.+!" = "MAJOR", "^BREAKING[\\- ]CHANGE" = "MAJOR", "^feat" = "MINOR", "^.*" = "PATCH" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
# Security floors for transitive packages: a resolver can never go back to a vulnerable version.
# urllib3 >= 2.8.0 guards GHSA-vxq7-64xx-v4gw and GHSA-8988-9cw3-xx77 (high) and GHSA-gh4c-6fx4-qh6g
# (medium). soupsieve >= 2.9.0 guards GHSA-gjv8-xp57-g29c and GHSA-j934-xhv5-fg8f (medium).
constraint-dependencies = [
  "soupsieve>=2.9.0",
  "urllib3>=2.8.0",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
