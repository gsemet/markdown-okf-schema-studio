version: 1
tiers:
  StRS: {folder: strs, prefix: StRS-MDOKFSTUDIO, derives_from: [], approval_lock: true,
    owner_email: gaetan@xeberon.net}
  SwRS: {folder: swrs, prefix: SwRS-MDOKFSTUDIO, derives_from: [StRS], approval_lock: false,
    owner_email: gaetan@xeberon.net}
id_policy: scope-prefix-sequence
strs_test_coverage_mode: linked-swrs-and-validation-test
lifecycle:
  field: lifecycle
markers:
  implements: '@implements_req'
  tests: '@tests_req'
  id_pattern: '[A-Za-z][A-Za-z0-9_-]*'
generated_fields: [derived_by, implemented_in_files, tested_in_files, default_owner_email]
scopes:
  rendering-core:
    id_token: CORE
    folder: rendering-core
    source_dirs:
      - src
      - sphinx
      - skills
    test_dirs:
      - test
      - sphinx/tests
  code-blocks:
    id_token: CODE
    folder: code-blocks
    source_dirs:
      - src
      - sphinx
    test_dirs:
      - test
      - sphinx/tests
