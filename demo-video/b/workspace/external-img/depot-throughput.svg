<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title">
  <title id="title">A vehicle's day at the depot: arrival, inspection, charging, release</title>
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3eef6" />
      <stop offset="1" stop-color="#cfe3f0" />
    </linearGradient>
    <marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#386c91" />
    </marker>
  </defs>
  <rect width="960" height="300" rx="16" fill="#f6f9fb" />
  <rect x="24" y="24" width="912" height="252" rx="12" fill="url(#band)" opacity="0.55" />
  <g fill="#ffffff" stroke="#244f6c" stroke-width="3">
    <rect x="48" y="96" width="172" height="104" rx="14" />
    <rect x="278" y="96" width="172" height="104" rx="14" />
    <rect x="508" y="96" width="172" height="104" rx="14" />
    <rect x="738" y="96" width="172" height="104" rx="14" />
  </g>
  <g fill="none" stroke="#386c91" stroke-width="4" marker-end="url(#head)">
    <path d="M222 148H274" />
    <path d="M452 148H504" />
    <path d="M682 148H734" />
  </g>
  <g font-family="sans-serif" text-anchor="middle">
    <g fill="#18384f" font-size="24" font-weight="600">
      <text x="134" y="140">Arrival</text>
      <text x="364" y="140">Inspection</text>
      <text x="594" y="140">Charging</text>
      <text x="824" y="140">Release</text>
    </g>
    <g fill="#4a6a80" font-size="16">
      <text x="134" y="168">gate scan</text>
      <text x="364" y="168">12 point check</text>
      <text x="594" y="168">to 90 percent</text>
      <text x="824" y="168">route handover</text>
    </g>
    <g fill="#244f6c" font-size="15" font-weight="600">
      <text x="134" y="62">5 min</text>
      <text x="364" y="62">18 min</text>
      <text x="594" y="62">55 min</text>
      <text x="824" y="62">7 min</text>
    </g>
    <text x="480" y="254" fill="#4a6a80" font-size="16">A vehicle spends about 85 minutes in the depot between two routes.</text>
  </g>
</svg>
