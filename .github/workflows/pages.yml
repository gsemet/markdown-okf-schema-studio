name: Deploy GitHub Pages

on:
  workflow_call:
    inputs:
      tag:
        description: "Existing version tag to deploy"
        required: true
        type: string
      reports_from_caller:
        description: "The calling CI run holds a green heavy run of this commit: use its reports"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to deploy (leave empty for a dry run)"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Build the site from the checked-out ref without deploying; no tag needed"
        type: boolean
        default: false
      run_id:
        description: "CI run whose end-to-end reports to use (default: latest green heavy run of the commit)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  build-site:
    # A real deployment needs a tag; a dry run (manual dispatch) needs none and never deploys.
    if: inputs.tag != '' || github.ref_type == 'tag' || inputs.dry_run
    runs-on: ubuntu-latest
    env:
      STUDIO_NPM: npm --registry=https://registry.npmjs.org/
      DEPLOYMENT_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          lfs: true
      - name: Fetch Git LFS objects
        run: git lfs pull
      - name: Verify Git LFS objects
        run: git lfs fsck
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
        with:
          just-version: 1.58.0
      - run: npm ci
      - run: uv sync --group docs --group requirements
      - name: Verify deployment tag
        if: env.DEPLOYMENT_TAG != ''
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOYMENT_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$DEPLOYMENT_TAG^{commit}")"
          git merge-base --is-ancestor HEAD "origin/${{ github.event.repository.default_branch }}"
          expected_tag="v$(node -p "require('./package.json').version")"
          if [[ "$DEPLOYMENT_TAG" != "$expected_tag" ]]; then
            echo "Deployment tag $DEPLOYMENT_TAG does not match package version $expected_tag" >&2
            exit 1
          fi
      # Reuse of CI reports. On the automatic release path, ci.yml calls this workflow from the push
      # run of the version change, after its heavy jobs (integration and stress) succeeded: the
      # caller says so with reports_from_caller, and the reports are taken from that same run (it
      # is still in progress, so the selection below could not find it). Otherwise the selection
      # looks for the newest green heavy run of the commit: a manual heavy run or that release push.
      # An explicit run_id goes through the same checks and fails closed on any mismatch; the
      # automatic selection falls back to the suite on any API or download problem.
      - name: Find the end-to-end reports of this commit
        id: reports
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ inputs.run_id }}
          FROM_CALLER: ${{ inputs.reports_from_caller }}
        run: |
          set -euo pipefail
          if [[ "$FROM_CALLER" == "true" ]]; then
            echo "from_caller=true" >> "$GITHUB_OUTPUT"
            echo "Reports from the calling run: $GITHUB_RUN_ID"
            exit 0
          fi
          args=(--repo "$GITHUB_REPOSITORY" --sha "$(git rev-parse HEAD)")
          if [[ -n "$REQUESTED_RUN_ID" ]]; then
            args+=(--run-id "$REQUESTED_RUN_ID")
          fi
          run_id="$(uv run --no-sync python scripts/select_e2e_run.py "${args[@]}")"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Reports from run: ${run_id:-none (the suite runs below)}"
      # studio-reports merges both stage artifacts (e2e-visual, e2e-integration): it alone is enough.
      - name: Fetch the end-to-end reports of the calling run
        id: download-caller
        if: steps.reports.outputs.from_caller == 'true'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: studio-reports
          path: out/reports/
      - name: Download the end-to-end reports
        id: download
        if: steps.reports.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: studio-reports
          path: out/reports/
          run-id: ${{ steps.reports.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Decide whether the downloaded reports are used
        id: usable
        shell: bash
        env:
          FOUND: ${{ steps.reports.outputs.run_id || (steps.reports.outputs.from_caller == 'true' && github.run_id) || '' }}
          DOWNLOAD: ${{ steps.reports.outputs.from_caller == 'true' && steps.download-caller.outcome || steps.download.outcome }}
          REQUESTED_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          if [[ -n "$FOUND" && "$DOWNLOAD" == "success" ]]; then
            echo "reports=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "$FOUND" && -n "$REQUESTED_RUN_ID" ]]; then
            echo "::error::Download of the reports of the requested run $FOUND failed"
            exit 1
          else
            if [[ -n "$FOUND" ]]; then
              echo "::warning::Download of the reports of run $FOUND failed; the suite runs instead"
            fi
            rm -rf out/reports
            echo "reports=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build Pages site from the downloaded reports
        if: steps.usable.outputs.reports == 'true'
        run: just site-assemble
      - name: Install the end-to-end suite dependencies (fallback)
        if: steps.usable.outputs.reports != 'true'
        run: |
          sudo -n apt-get update && sudo -n apt-get install --yes --no-install-recommends plantuml graphviz
          uv run --no-sync --group docs playwright install --with-deps chromium
      - name: Build Pages site by running the suite (fallback)
        if: steps.usable.outputs.reports != 'true'
        run: xvfb-run --auto-servernum just site
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: out/site

  deploy-pages:
    needs: build-site
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
