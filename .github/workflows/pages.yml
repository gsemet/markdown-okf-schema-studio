name: Deploy GitHub Pages

on:
  workflow_call:
    inputs:
      tag:
        description: "Existing version tag to deploy"
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to deploy"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-pages:
    if: inputs.tag != '' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      STUDIO_NPM: npm --registry=https://registry.npmjs.org/
      DEPLOYMENT_TAG: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          lfs: true
      - name: Fetch Git LFS objects
        run: git lfs pull
      - name: Verify Git LFS objects
        run: git lfs fsck
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
        with:
          just-version: 1.58.0
      - name: Install PlantUML and Graphviz
        run: sudo -n apt-get update && sudo -n apt-get install --yes --no-install-recommends plantuml graphviz
      - run: npm ci
      - run: uv sync --group docs --group requirements
      - run: uv run --no-sync --group docs playwright install --with-deps chromium
      - name: Verify deployment tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOYMENT_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$DEPLOYMENT_TAG^{commit}")"
          git merge-base --is-ancestor HEAD "origin/${{ github.event.repository.default_branch }}"
          expected_tag="v$(node -p "require('./package.json').version")"
          if [[ "$DEPLOYMENT_TAG" != "$expected_tag" ]]; then
            echo "Deployment tag $DEPLOYMENT_TAG does not match package version $expected_tag" >&2
            exit 1
          fi
      - name: Build Pages site
        run: xvfb-run --auto-servernum just site
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: out/site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4