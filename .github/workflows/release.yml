name: Release VSIX

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to publish"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $expected_tag" >&2
            exit 1
          fi
      - run: npm run package
      - name: Verify Marketplace token
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [[ -z "${VSCE_PAT:-}" ]]; then
            echo "The release environment must provide the VSCE_PAT secret" >&2
            exit 1
          fi
      - name: Publish to VS Code Marketplace
        run: npx --no-install vsce publish --packagePath out/reports/package/markdown-okf-schema-studio.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Attach VSIX to GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: out/reports/package/markdown-okf-schema-studio.vsix
