name: Release VSIX

on:
  workflow_call:
    inputs:
      tag:
        description: "Existing version tag to publish"
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to publish"
        required: true
        type: string
      notes:
        description: "Release notes: generated by Copilot, or a placeholder to replace by hand"
        required: false
        type: choice
        default: generated
        options:
          - generated
          - placeholder

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Dependency install scripts stay off in the job that holds the publish secrets; and
      # the build needs no install step: the MyST source patches are applied in memory by esbuild.
      - run: npm ci --ignore-scripts
      - name: Verify release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable vX.Y.Z release tag" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD "origin/${{ github.event.repository.default_branch }}"
          expected_tag="v$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $expected_tag" >&2
            exit 1
          fi
          node -e 'const p=require("./package.json"), l=require("./package-lock.json"); if(l.version!==p.version || l.packages[""].version!==p.version) process.exit(1)'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      # A manual dispatch runs the notes script of the workflow's own ref (github.sha), so a fix
      # merged on main can (re)publish an existing tag; packaging and publishing stay on the tag.
      # Only workflow_dispatch: inside workflow_call, github.event_name is the caller's event.
      - name: Load the release notes script of the workflow ref
        if: github.event_name == 'workflow_dispatch' && inputs.notes != 'placeholder'
        shell: bash
        run: |
          set -euo pipefail
          if ! git cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$GITHUB_SHA"
          fi
          mkdir -p "$RUNNER_TEMP/tools"
          git show "$GITHUB_SHA:scripts/release_notes.py" > "$RUNNER_TEMP/tools/release_notes.py"
      - name: Generate user-facing release notes (workflow ref script)
        if: github.event_name == 'workflow_dispatch' && inputs.notes != 'placeholder'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: uv run python "$RUNNER_TEMP/tools/release_notes.py" --to-ref "$RELEASE_TAG"
      - name: Generate user-facing release notes
        if: github.event_name != 'workflow_dispatch'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: uv run python scripts/release_notes.py --to-ref "$RELEASE_TAG"
      # The placeholder is replaced by hand on the GitHub release afterwards.
      - name: Write placeholder release notes
        if: github.event_name == 'workflow_dispatch' && inputs.notes == 'placeholder'
        shell: bash
        run: printf '## Maintenance\n\n- Release notes to be published by hand.\n' > release-notes.md
      - name: Upload validated notes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-notes-${{ env.RELEASE_TAG }}
          path: release-notes.md
          if-no-files-found: error
      - run: npm run package
      - name: Verify Marketplace token
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [[ -z "${VSCE_PAT:-}" ]]; then
            echo "The release environment must provide the VSCE_PAT secret" >&2
            exit 1
          fi
      - name: Publish to VS Code Marketplace
        run: npx --no-install vsce publish --skip-duplicate --packagePath out/reports/package/markdown-okf-schema-studio.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Attach VSIX to GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          draft: false
          files: out/reports/package/markdown-okf-schema-studio.vsix
