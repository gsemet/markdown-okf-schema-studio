# THROWAWAY proof (never merge): shows what "Re-run failed jobs" does on attempt 2, mirroring the
# release graph of ci.yml: `ok` stands for release-check (passes, has an output, not re-run),
# `flaky` for a heavy job (fails on attempt 1 only, uploads an artifact with a fixed name),
# `dependent` for report/checks (skipped on attempt 1), `final` for tag-release (`!cancelled()`,
# refuses when its dependency is not green, reads the outputs of `ok` and the artifact of `flaky`).
# Expected: attempt 1 = ok success, flaky failure, dependent skipped, final failure. After
# "Re-run failed jobs": ok NOT re-run (keeps attempt 1 output), flaky, dependent and final re-run
# and pass; final shows run_attempt 2, the same sha and event.before, ok_attempt=1, and the
# newest flaky artifact (attempt 2) with no name conflict on upload.
name: zz rerun proof

on:
  push:
    branches: [change-requests/195-require-green-heavy-before-tagging]
    paths: ['.github/workflows/zz-rerun-proof.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ok:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      bump: ${{ steps.out.outputs.bump }}
      attempt: ${{ steps.out.outputs.attempt }}
    steps:
      - id: out
        run: |
          echo "bump=true" >> "$GITHUB_OUTPUT"
          echo "attempt=${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          echo "ok ran on attempt ${{ github.run_attempt }}"

  flaky:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "attempt ${{ github.run_attempt }}" > flaky.txt
      - name: Fail on the first attempt only
        run: if [ "${{ github.run_attempt }}" = 1 ]; then exit 1; fi
      - name: Upload with a fixed name (as the heavy jobs do)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: proof-flaky
          path: flaky.txt

  dependent:
    needs: flaky
    if: ${{ !cancelled() && needs.flaky.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "dependent ran on attempt ${{ github.run_attempt }}"

  final:
    needs: [ok, dependent]
    if: ${{ !cancelled() && needs.ok.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: proof-flaky
          path: proof/
      - name: Record the re-run context
        env:
          ATTEMPT: ${{ github.run_attempt }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
          OK_BUMP: ${{ needs.ok.outputs.bump }}
          OK_ATTEMPT: ${{ needs.ok.outputs.attempt }}
          DEPENDENT: ${{ needs.dependent.result }}
        run: |
          {
            echo "## Re-run proof"
            echo "- run_attempt: $ATTEMPT"
            echo "- sha: $SHA"
            echo "- event: $EVENT"
            echo "- event.before: ${BEFORE:-<none>}"
            echo "- needs.ok.outputs.bump: $OK_BUMP (ok ran on attempt $OK_ATTEMPT)"
            echo "- needs.dependent.result: $DEPENDENT"
            echo "- proof-flaky artifact: $(cat proof/flaky.txt 2>/dev/null || echo '<missing>')"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
      - name: Refuse when the dependency is not green (as tag-release does)
        if: needs.dependent.result != 'success'
        run: |
          echo "::error::dependent is ${{ needs.dependent.result }}"
          exit 1
