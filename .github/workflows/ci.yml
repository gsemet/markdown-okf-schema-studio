name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      STUDIO_NPM: npm --registry=https://registry.npmjs.org/
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Fetch Git LFS objects
        run: git lfs pull
      - name: Verify Git LFS objects
        run: git lfs fsck
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: extractions/setup-just@v2
      - name: Install PlantUML and Graphviz
        run: sudo -n apt-get update && sudo -n apt-get install --yes --no-install-recommends plantuml graphviz
      - run: npm ci
      - run: uv sync --group docs
      - run: uv run --no-sync --group docs playwright install --with-deps chromium
      - name: Run full preflight
        run: xvfb-run --auto-servernum just preflight
      - name: Ensure justfile formatting is clean
        run: |
          just format
          git diff --exit-code -- justfile
      - name: Publish reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-reports
          path: out/reports/
          if-no-files-found: warn

  tag-release:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Tag a committed version bump
        id: tag
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: uv run --group release python scripts/version.py --tag-before "$BEFORE_SHA"

  release:
    needs: tag-release
    if: needs.tag-release.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag-release.outputs.tag }}
    secrets: inherit
