name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      heavy:
        description: Also run the real VS Code jobs (integration and stress, about 10 and 20 minutes)
        type: boolean
        default: false
      gallery:
        description: Also build the gallery and the site from the end-to-end reports (needs heavy)
        type: boolean
        default: false
      stress_repeat:
        description: Stress rounds per window, 1 to 100 (heavy only; empty means 20). Above about 20, narrow stress_scenarios or the run exceeds the time limits
        type: string
        default: ""
      stress_scenarios:
        description: Comma-separated stress scenario names to loop (heavy only; empty means all)
        type: string
        default: ""

env:
  STUDIO_NPM: npm --registry=https://registry.npmjs.org/
  # One end-to-end campaign id per workflow run, shared by the visual and integration jobs;
  # each job records its own real start time. The attempt number is left out on purpose: re-running
  # only the failed jobs must keep the same id, or the report job would see two campaigns.
  # Artifact names are the opposite: each ends with the attempt that uploaded it, because after
  # "Re-run failed jobs" a download by a fixed name returned the attempt-1 artifact. A job whose
  # artifact is consumed later announces the name in its `artifact` output; a job that is not
  # re-run keeps its outputs, so a consumer always gets the newest attempt of each producer.
  STUDIO_E2E_RUN_ID: ${{ github.run_id }}

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - name: Fetch Git LFS objects
        run: git lfs pull
      - name: Verify Git LFS objects
        run: git lfs fsck
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
        with:
          just-version: 1.58.0
      - run: just dev-ci
      - run: just ci-static
      - name: Publish reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports-static-attempt-${{ github.run_attempt }}
          path: out/reports/
          if-no-files-found: warn

  visual:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    outputs:
      artifact: e2e-visual-attempt-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - name: Fetch Git LFS objects
        run: git lfs pull
      - name: Verify Git LFS objects
        run: git lfs fsck
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
        with:
          just-version: 1.58.0
      # Only this job installs Ubuntu packages (just dev-ci visual); it keeps their archives in a
      # cache so a slow mirror cannot stall it. The key changes only when the package set changes.
      # The key names the runner image (ImageOS, for example ubuntu24), so a new image release
      # starts its own archive set. ImageOS is a runner variable, which the env context does not
      # see until it is written to GITHUB_ENV.
      - name: Name the runner image for the package cache
        run: echo "RUNNER_IMAGE_OS=${ImageOS:-unknown}" >> "$GITHUB_ENV"
      - name: Restore Ubuntu package archives
        id: apt-archives
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/apt-archives
          key: apt-archives-visual-${{ runner.os }}-${{ env.RUNNER_IMAGE_OS }}-${{ runner.arch }}
          restore-keys: apt-archives-visual-${{ runner.os }}-${{ env.RUNNER_IMAGE_OS }}-${{ runner.arch }}-
      - run: just dev-ci visual
      - name: Save Ubuntu package archives
        # Skipped when no archive was kept, or when the restored archives are exactly the ones this
        # run used.
        if: >-
          hashFiles('.cache/apt-archives/*.deb') != '' &&
          steps.apt-archives.outputs.cache-matched-key != format('apt-archives-visual-{0}-{1}-{2}-{3}',
          runner.os, env.RUNNER_IMAGE_OS, runner.arch, hashFiles('.cache/apt-archives/*.deb'))
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/apt-archives
          key: apt-archives-visual-${{ runner.os }}-${{ env.RUNNER_IMAGE_OS }}-${{ runner.arch }}-${{ hashFiles('.cache/apt-archives/*.deb') }}
      - run: just ci-visual
      - name: Publish reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-visual-attempt-${{ github.run_attempt }}
          path: out/reports/
          if-no-files-found: warn

  # Does this push to main change the package version? The same test as tag-release (scripts/
  # version.py), so a version change always gets the heavy jobs below, and tag-release requires
  # them to be green before it tags.
  release-check:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    outputs:
      bump: ${{ steps.bump.outputs.bump }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Detect a committed version change
        id: bump
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: uv run --group release python scripts/version.py --bump-since "$BEFORE_SHA"

  # Heavy: the real VS Code window tests. They do not run on a pull request, nor on a push to main
  # unless the push changes the version (a release: release-check). Start them by hand with
  # `gh workflow run ci.yml --ref <branch> -f heavy=true` (or "Run workflow" in Actions).
  # Not part of `checks`. `!cancelled()`: release-check is skipped outside a push to main.
  integration:
    needs: release-check
    if: ${{ !cancelled() && ((github.event_name == 'workflow_dispatch' && inputs.heavy) || needs.release-check.outputs.bump == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    outputs:
      artifact: e2e-integration-attempt-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - name: Fetch Git LFS objects
        run: git lfs pull
      - name: Verify Git LFS objects
        run: git lfs fsck
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
        with:
          just-version: 1.58.0
      - run: just dev-ci
      # Below the job's 30 minutes: a hang cancels this step and the dump and upload steps still run.
      - run: xvfb-run --auto-servernum just ci-integration
        timeout-minutes: 20
      - name: Collect hang diagnostics
        if: always()
        run: just ci-hang-dump
      - name: Publish reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-integration-attempt-${{ github.run_attempt }}
          path: out/reports/
          if-no-files-found: warn

  # Heavy (with integration): repeats the flake-prone and the new real-window scenarios (20
  # rounds, in the trusted window then in the Restricted Mode window); a race that a single run
  # passes by luck fails here. Its reports are not part of the e2e campaign.
  # Advisory: a red stress run flags a flake to fix (CI rule 12) but does not block merges. On a
  # version change it blocks the release: continue-on-error is off, so the run turns red and
  # needs.stress.result reports the failure to tag-release.
  stress:
    needs: release-check
    if: ${{ !cancelled() && ((github.event_name == 'workflow_dispatch' && inputs.heavy) || needs.release-check.outputs.bump == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    continue-on-error: ${{ needs.release-check.outputs.bump != 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - name: Fetch Git LFS objects
        run: git lfs pull
      - name: Verify Git LFS objects
        run: git lfs fsck
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
        with:
          just-version: 1.58.0
      - run: just dev-ci
      - name: Run the stress rounds
        env:
          STUDIO_STRESS_REPEAT: ${{ inputs.stress_repeat || '20' }}
          STUDIO_STRESS_SCENARIOS: ${{ inputs.stress_scenarios }}
        run: xvfb-run --auto-servernum just ci-stress
      - name: Publish reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stress-integration-attempt-${{ github.run_attempt }}
          path: out/reports/
          if-no-files-found: warn

  report:
    needs: [release-check, visual, integration]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    outputs:
      artifact: studio-reports-attempt-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - name: Fetch Git LFS objects
        run: git lfs pull
      - name: Verify Git LFS objects
        run: git lfs fsck
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
        with:
          just-version: 1.58.0
      - run: just dev-ci
      # Each stage from the attempt that produced it: after "Re-run failed jobs" on integration,
      # visual (not re-run) keeps its attempt-1 artifact and integration has a new one. `pattern`
      # with an exact name, not `name`: a missing artifact (skipped or timed-out job) downloads
      # nothing, and ci-report then says which stage is missing. The `if`: an empty pattern would
      # download every artifact of the run (a job that never started has no outputs).
      - name: Download the visual stage reports
        if: needs.visual.outputs.artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ${{ needs.visual.outputs.artifact }}
          path: out/reports/
          merge-multiple: true
      - name: Download the integration stage reports
        if: needs.integration.outputs.artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ${{ needs.integration.outputs.artifact }}
          path: out/reports/
          merge-multiple: true
      # Without the heavy jobs the real VS Code stage is reported as skipped (visual only).
      - run: just ci-report ${{ ((github.event_name == 'workflow_dispatch' && inputs.heavy) || needs.release-check.outputs.bump == 'true') && 'all' || 'visual' }}
      - name: Publish merged reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: studio-reports-attempt-${{ github.run_attempt }}
          path: out/reports/
          if-no-files-found: warn

  gallery:
    needs: report
    # The gallery and its README images need the real-window captures of the heavy jobs.
    if: github.event_name == 'workflow_dispatch' && inputs.gallery && inputs.heavy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - name: Fetch Git LFS objects
        run: git lfs pull
      - name: Verify Git LFS objects
        run: git lfs fsck
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
        with:
          just-version: 1.58.0
      - run: just dev-ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.report.outputs.artifact }}
          path: out/reports/
      - run: just ci-gallery
      - name: Publish gallery and site
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: studio-site-attempt-${{ github.run_attempt }}
          path: out/site/
          if-no-files-found: warn

  # Stable aggregate name for branch protection: it depends on every required check job, the
  # simulated ones. The real VS Code jobs are not among them: they are manual, except on a push
  # that changes the version, where `report` merges the integration stage and tag-release requires
  # both heavy jobs (CI rule 14).
  checks:
    needs: [static, visual, report]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Require every check job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done

  tag-release:
    needs: [checks, release-check, integration, stress]
    # `checks` runs even though the heavy jobs above it are skipped; a plain `if` carries an
    # implicit success() that is false when any ancestor was skipped, so ask for the result.
    # The heavy jobs are skipped on a push without a version change: red checks skip this job, as
    # before. On a version change the job also runs when checks failed (an integration failure
    # fails report, then checks), so that every untagged version change says why in its summary;
    # the tag step requires checks and both heavy jobs to be green.
    if: ${{ !cancelled() && needs.release-check.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.checks.result == 'success' || needs.release-check.outputs.bump == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Refuse to tag a version change without a green heavy run
        if: needs.release-check.outputs.bump == 'true' && !(needs.checks.result == 'success' && needs.integration.result == 'success' && needs.stress.result == 'success')
        env:
          CHECKS: ${{ needs.checks.result }}
          INTEGRATION: ${{ needs.integration.result }}
          STRESS: ${{ needs.stress.result }}
          RUN_ID: ${{ github.run_id }}
        run: |
          {
            echo "## Release not tagged"
            echo
            echo "This push changes the version, but the checks or the heavy run of this commit"
            echo "were not green, so tagging was skipped (no tag, no release, no Pages deploy)."
            echo
            echo "- checks: $CHECKS"
            echo "- integration: $INTEGRATION"
            echo "- stress: $STRESS"
            echo
            echo "Only this push can tag this version (a later push without a version change does"
            echo "not). For a flake, re-run the failed jobs of this run (Re-run jobs > Re-run failed"
            echo "jobs, or \`gh run rerun $RUN_ID --failed\`): this job re-runs with them and tags"
            echo "when they pass, and Pages uses the reports of the newest attempt. If the failure is"
            echo "a real bug, fix it and release a new version."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Tagging skipped: checks or heavy run not green (checks: $CHECKS, integration: $INTEGRATION, stress: $STRESS)"
          exit 1
      - name: Tag a committed version bump
        id: tag
        if: needs.checks.result == 'success' && (needs.release-check.outputs.bump != 'true' || (needs.integration.result == 'success' && needs.stress.result == 'success'))
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: uv run --group release python scripts/version.py --tag-before "$BEFORE_SHA"

  release:
    needs: tag-release
    # Same reason as tag-release: do not inherit success() from the skipped heavy ancestors.
    if: ${{ !cancelled() && needs.tag-release.result == 'success' && needs.tag-release.outputs.tag != '' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag-release.outputs.tag }}
    secrets: inherit

  # Tags pushed with GITHUB_TOKEN do not trigger tag workflows, so deploy Pages from here.
  pages:
    # integration and stress: to tell Pages that this run holds green heavy reports to reuse;
    # report: the name of its merged reports artifact (newest attempt that ran report).
    needs: [tag-release, integration, stress, report]
    # Same reason as tag-release: do not inherit success() from the skipped heavy ancestors.
    if: ${{ !cancelled() && needs.tag-release.result == 'success' && needs.tag-release.outputs.tag != '' }}
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      tag: ${{ needs.tag-release.outputs.tag }}
      # A tag means a version change whose heavy jobs were green (tag-release); checked again here.
      reports_from_caller: ${{ needs.integration.result == 'success' && needs.stress.result == 'success' }}
      reports_artifact: ${{ needs.report.outputs.artifact }}
