<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 520" width="1240" height="520" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Release 1.6.1, hour by hour (UTC)</title>
<desc id="d">Swimlane timeline of release 1.6.1 on 2026-11-11, in UTC. The evening before, the agents opened six fix pull requests. From 07:36 to 10:37 the owner merged them. The heavy CI run on main was green at 10:59. At 11:00 the owner said go; the Chief of Staff wrote the notes and opened version PR 354 at 11:16. The owner said publish at 11:30, then was asked nothing. The version push jobs were green and the tag, release, Marketplace and Pages were published from 11:52 to 11:55. The release was archived around 12:05. No fix change was needed. Two steps marked new were added after this release: the notes rendered in the version PR body, and a retro at the archive.</desc>
